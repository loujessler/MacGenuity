name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regression tests
        run: |
          bash Tests/Regression/run.sh
          bash Tests/QuadCast2S/run.sh
          python3 Tests/Regression/installer_test.py
          python3 Tests/Regression/relaunch_test.py
          python3 Tests/Regression/relaunch_test.py --reset
      - name: Universal release build
        env:
          HYPERX_UNIVERSAL: '1'
          HYPERX_SIGN_IDENTITY: '-'
          HYPERX_ALLOW_DEBUG: '0'
        run: ./build.sh
      - name: Verify bundle
        run: |
          plutil -lint build/MacGenuity.app/Contents/Info.plist
          ARCHS="$(lipo -archs build/MacGenuity.app/Contents/MacOS/MacGenuity)"
          [[ "${ARCHS}" == "x86_64 arm64" || "${ARCHS}" == "arm64 x86_64" ]]
          codesign --verify --deep --strict build/MacGenuity.app
      - name: Package and mount-test DMG
        if: matrix.os == 'macos-15-intel'
        run: bash tools/package-dmg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'macos-15-intel'
        with:
          name: MacGenuity-dmg
          path: build/MacGenuity-*.dmg
          if-no-files-found: error

  release:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MacGenuity-dmg
          path: dist
      - name: Prepare release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' MacGenuity/Resources/Info.plist)"
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]
          test -s "dist/MacGenuity-$VERSION.dmg"
          PREVIOUS="$(gh release view --json tagName --jq .tagName)"
          git show "${PREVIOUS}:MacGenuity/Resources/Info.plist" > "$RUNNER_TEMP/previous.plist"
          python3 - "$RUNNER_TEMP/previous.plist" <<'PY'
          import pathlib, plistlib, sys
          old, new = (plistlib.loads(pathlib.Path(path).read_bytes())
                      for path in [sys.argv[1], "MacGenuity/Resources/Info.plist"])
          if int(new["CFBundleVersion"]) <= int(old["CFBundleVersion"]):
              sys.exit("Increment CFBundleVersion before publishing an update")
          version = new["CFBundleShortVersionString"]
          if tuple(map(int, version.split("."))) <= tuple(map(int, old["CFBundleShortVersionString"].split("."))):
              sys.exit("Stable release version must be newer than the published release")
          notes = pathlib.Path("CHANGELOG.md").read_text().split(f"## [{version}] — ", 1)[1]
          pathlib.Path("release-notes.txt").write_text(notes.split("\n", 1)[1].split("\n## [", 1)[0].strip() + "\n")
          PY
          bash tools/fetch-sparkle.sh "$RUNNER_TEMP/sparkle"
      - name: Sign update and feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" dist
          grep -q 'sparkle:edSignature=' dist/appcast.xml
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - --verify dist/appcast.xml
      - name: Publish stable release with signed feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "MacGenuity ${GITHUB_REF_NAME#v}" --notes-file ../release-notes.txt \
            *.dmg appcast.xml SHA256SUMS
