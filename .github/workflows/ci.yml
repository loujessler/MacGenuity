name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regression tests
        run: |
          bash Tests/Regression/run.sh
          bash Tests/QuadCast2S/run.sh
          python3 Tests/Regression/installer_test.py
      - name: Universal release build
        env:
          HYPERX_UNIVERSAL: '1'
          HYPERX_SIGN_IDENTITY: '-'
          HYPERX_ALLOW_DEBUG: '0'
        run: ./build.sh
      - name: Verify bundle
        run: |
          plutil -lint build/MacGenuity.app/Contents/Info.plist
          ARCHS="$(lipo -archs build/MacGenuity.app/Contents/MacOS/MacGenuity)"
          [[ "${ARCHS}" == "x86_64 arm64" || "${ARCHS}" == "arm64 x86_64" ]]
          codesign --verify --deep --strict build/MacGenuity.app
      - name: Package and mount-test DMG
        if: matrix.os == 'macos-15-intel'
        run: bash tools/package-dmg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'macos-15-intel'
        with:
          name: MacGenuity-dmg
          path: build/MacGenuity-*.dmg
          if-no-files-found: error
